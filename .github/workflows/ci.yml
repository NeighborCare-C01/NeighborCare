name: CI - Repository checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Markdown local links
        run: python3 .github/scripts/check_repository.py

      - name: Check YAML syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0))' "$file"
            echo "OK $file"
          done < <(find .github -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)

      - name: Check changed-line whitespace
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --check "origin/${BASE_REF}...HEAD"

      - name: Check clean worktree
        run: |
          test -z "$(git status --porcelain)"

  backend:
    name: backend-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Java and Maven only when backend exists
        if: ${{ hashFiles('backend/pom.xml') != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ vars.NEIGHBORCARE_JAVA_VERSION || '17' }}
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend, or state missing bootstrap
        shell: bash
        run: |
          if [ -f backend/pom.xml ]; then
            (cd backend && mvn -B verify)
          else
            echo "Backend non inizializzato: nessuna build Maven fittizia eseguita."
          fi

  frontend:
    name: frontend-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node.js only when frontend exists
        if: ${{ hashFiles('frontend/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NEIGHBORCARE_NODE_VERSION || '22' }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify frontend, or state missing bootstrap
        shell: bash
        run: |
          if [ -f frontend/package.json ]; then
            test -f frontend/package-lock.json || { echo "::error::Missing frontend/package-lock.json"; exit 1; }
            cd frontend
            npm ci
            npm run build
            npm test -- --run
          else
            echo "Frontend non inizializzato: nessun test Node fittizio eseguito."
          fi
