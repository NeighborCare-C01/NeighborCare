name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Controlla il diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --check "origin/${BASE_REF}...HEAD"
      - name: Stato dei test applicativi
        run: echo 'Frontend e backend non inizializzati. Build e test applicativi da aggiungere al bootstrap approvato; questo controllo non ne certifica il funzionamento.'
