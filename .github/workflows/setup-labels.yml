name: Setup agentic labels - manual

on:
  workflow_dispatch:
    inputs:
      approve:
        description: "Autorizzo creazione/aggiornamento delle etichette delle fasi"
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  sync-labels:
    if: ${{ inputs.approve == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Sync labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/sync_labels.py --repo "$GITHUB_REPOSITORY" --apply
