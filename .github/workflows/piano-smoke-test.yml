# Test temporaneo (slide 82): verificare trigger della label e permessi, senza AI.
name: Test - Label fase:piano

on:
  issues:
    types: [labeled]

permissions:
  issues: write

concurrency:
  group: test-piano-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  saluto:
    name: verify-label-trigger
    if: github.event.label.name == 'fase:piano'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Commenta la Issue di prova
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body             "✅ [TEST workflow] La label \`fase:piano\` ha attivato GitHub Actions. Nessun agente AI è stato eseguito. Il Pianificatore verrà collegato dopo questa verifica."
