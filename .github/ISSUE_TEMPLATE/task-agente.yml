name: Task per agente
description: Task tracciato su baseline RAD v1.0 e SDD v0.0 definitive, con piano e approvazione TM.
title: "[TASK] "
labels: ["task-agente"]
body:
  - type: input
    id: riferimenti
    attributes:
      label: ID requisito o caso d’uso
      description: Usa ID reali del RAD; per setup o documentazione indica N/A e il motivo.
    validations:
      required: true
  - type: input
    id: tm
    attributes:
      label: Technical Manager (TM) assegnato
      description: Nome o username del developer responsabile della revisione e dell'approvazione del piano.
    validations:
      required: true
  - type: textarea
    id: obiettivo
    attributes:
      label: Descrizione e obiettivo
      description: Descrivi il risultato richiesto e l’ambito della modifica.
    validations:
      required: true
  - type: textarea
    id: modelli
    attributes:
      label: Riferimenti ai modelli
      description: Usa RAD v1.0 e SDD v0.0 definitivi (decisione PM 19/11/2026); cita percorsi, pagine e diagrammi. Segnala esplicitamente lacune o ambiguità.
    validations:
      required: true
  - type: textarea
    id: ambito
    attributes:
      label: Ambito (classi, metodi e file da modificare)
      description: Indica l’ambito previsto; se non ancora definito, richiedine l’analisi nel piano.
    validations:
      required: true
  - type: textarea
    id: accettazione
    attributes:
      label: Criteri di accettazione
      description: Risultati osservabili dalla specifica, inclusi errori e alternative pertinenti.
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: Test previsti
      description: Test Frame e fonte degli esiti attesi; per attività documentali indica le verifiche previste.
    validations:
      required: true
  - type: textarea
    id: dipendenze
    attributes:
      label: Dipendenze
      description: Issue prerequisite, impedimenti e decisioni pendenti; scrivi Nessuna se assenti.
    validations:
      required: true
